<main class="tools-page"><span class="section-label">FITTRACK</span><h1>Calculadora de intervalos</h1><p>Planifica tus intervalos de ejercicio y descanso antes de entrenar.</p>
<form id="intervalForm" class="tool-card"><label>Ejercicios por ronda<input id="exerciseCount" type="number" min="1" max="100" value="5" required></label>
<label>Rondas<input id="roundCount" type="number" min="1" max="100" value="3" required></label>
<label>Trabajo por ejercicio (segundos)<input id="workSeconds" type="number" min="1" max="3600" value="30" required></label>
<label>Descanso entre ejercicios (segundos)<input id="restSeconds" type="number" min="0" max="3600" value="15" required></label>
<button class="btn btn-primary" type="submit">Calcular duraci?n</button><button class="btn" type="reset">Restablecer</button></form>
<section class="tool-card" id="calculationResult" aria-live="polite" hidden></section>
<a class="btn btn-primary" href="./rutinas.html">Elegir rutina para entrenar ?</a></main>
<script src="../js/main.js"></script><script src="../js/calculadora.js"></script></body></html>
